name: Auto-update versions.json

on:
  push:
    branches:
      - master
    paths:
      - 'scripts/generate-versions.js'
      - 'package.json'

permissions:
  contents: write

jobs:
  update-versions:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate versions.json
        run: npm run generate-versions

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet public/versions.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push if changed
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/versions.json
          git commit -m "chore: Auto-update versions.json [skip ci]"
          git push
