name: Deploy Version Branch

on:
  push:
    branches:
      - 'v*.*.*' # Matches any branch like v1.0.0, v2.1.3, etc.

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH for submodules
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VALIDATOR_DEPLOY_KEY }}

      - uses: actions/checkout@v4

      - name: Checkout submodules via SSH
        run: |
          git config --global url."git@github.com:".insteadOf "https://github.com/"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Extract version from branch name
        id: version
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          echo "version=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate versions.json
        run: npm run generate-versions

      - name: Build
        run: npm run build
        env:
          PUBLIC_URL: /pdf-validator/${{ steps.version.outputs.version }}

      - name: Deploy to GitHub Pages (version folder)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          destination_dir: ${{ steps.version.outputs.version }}
          keep_files: true
