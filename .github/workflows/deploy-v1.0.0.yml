name: Deploy v1.0.0

on:
  push:
    branches:
      - v1.0.0

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH for submodules
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VALIDATOR_DEPLOY_KEY }}

      - uses: actions/checkout@v4

      - name: Checkout submodules via SSH
        run: |
          git config --global url."git@github.com:".insteadOf "https://github.com/"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate versions.json
        run: npm run generate-versions

      - name: Build
        run: npm run build
        env:
          PUBLIC_URL: /pdf-validator/v1.0.0

      - name: Deploy to GitHub Pages (v1.0.0 folder)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          destination_dir: v1.0.0
          keep_files: true

      - name: Success message
        run: |
          echo "✅ v1.0.0 deployed successfully!"
          echo "📍 URL: https://victorchei.github.io/pdf-validator/v1.0.0/"
